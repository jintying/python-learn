[pytest]
# 只在这些目录里找测试（默认会到处乱找，明确写出来更快也更清晰）
testpaths = tests

# 把项目根目录加进 sys.path，这样测试里可以直接 from adas import ...
# （等价于在 conftest.py 里手动改 sys.path，但更干净）
pythonpath = .

# 默认输出选项：
#   -v          显示每条用例的名字和结果
#   --tb=short  失败时只打印关键的回溯信息，不要刷屏
addopts = -v --tb=short

# 注册自定义标记（不注册的话 pytest 会警告）
markers =
    smoke: 冒烟测试 —— 发版前必跑的那一批
